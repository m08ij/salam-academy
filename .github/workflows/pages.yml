# Static preview of the site on GitHub Pages (no server: public homepage only; sign-in is disabled).
# Also publishes the latest Android APK + version.json from GitHub Releases under /apk/ for the in-app updater.
name: Pages preview

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend tests
        working-directory: backend
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q

      - name: Public data snapshot
        working-directory: backend
        env:
          SALAM_ENVIRONMENT: development
          SALAM_DATABASE_URL: sqlite:///./snapshot.db
          SALAM_APP_URL: http://localhost
        run: |
          export SALAM_MFA_ENCRYPTION_KEY=$(python -m app.cli gen-key)
          alembic upgrade head
          python -m app.cli seed
          python -m app.cli dump-public --out ../frontend/public/demo/overview.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build static site
        working-directory: frontend
        env:
          DEPLOY_TARGET: pages
          NEXT_PUBLIC_DEMO: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ env.BASE_PATH }}
        run: |
          npm ci
          npm run typecheck
          npx next build
          touch .next-pages/.nojekyll

      - name: Attach latest APK (if a release exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p frontend/.next-pages/apk
          if gh release view --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download --repo "$GITHUB_REPOSITORY" --pattern 'SalamAcademy.apk' --pattern 'version.json' --dir frontend/.next-pages/apk --clobber
          else
            echo "No release yet — skipping APK."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/.next-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
