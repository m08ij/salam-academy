# Render Blueprint — free trial hosting (New → Blueprint → pick this repository).
# One web service (site + API in one container) and a free PostgreSQL database.
# Free plan limits: the service sleeps after ~15 min without visits (first visit then takes ~1 min),
# and Render's free database expires after 30 days unless upgraded. Good for a trial, not for launch.
services:
  - type: web
    name: salam-academy
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/render.Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: salam-db
          property: connectionString
      - key: SALAM_SECRET_SEED          # random, generated by Render; the 2FA key is derived from it
        generateValue: true
      - key: SALAM_ENVIRONMENT
        value: production
      - key: SALAM_COOKIE_SECURE
        value: "true"
      - key: SALAM_SHOW_INVITE_LINKS    # no e-mail service on the trial: admins copy invite links and send them
        value: "true"
      - key: SALAM_REQUIRE_STAFF_MFA    # set to true before real launch
        value: "false"
      - key: SALAM_TRIAL_EMAILS         # comma-separated: only these e-mails can sign in during the trial
        sync: false
      - key: SALAM_OWNER_EMAIL          # first owner (created once); must be in SALAM_TRIAL_EMAILS
        sync: false
      - key: SALAM_OWNER_NAME
        sync: false
      - key: SALAM_OWNER_PASSWORD       # 12+ characters; you will be asked to change it on first sign-in
        sync: false

databases:
  - name: salam-db
    plan: free
    databaseName: salam
    user: salam
